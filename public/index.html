<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Mayhem – Bots Added!</title>
    <style>
        body { margin:0; padding:20px; background:#000; display:flex; flex-direction:column; align-items:center; font-family:Arial; }
        canvas { border:3px solid #fff; background:#111; image-rendering:pixelated; }
        #score { color:#0f0; font-size:28px; margin-top:10px; text-shadow:0 0 10px #0f0; }
        h1 { color:#0ff; text-shadow:0 0 15px #0ff; }
    </style>
</head>
<body>
    <h1>MULTIPLAYER MAYHEM</h1>
    <canvas id="canvas" width="1024" height="576"></canvas>
    <div id="score">Score: 0</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('canvas');
        const c = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        const ratio = window.devicePixelRatio || 1;
        canvas.width = 1024 * ratio;
        canvas.height = 576 * ratio;
        c.scale(ratio, ratio);

        const CANVAS_WIDTH = 1024;
        const CANVAS_HEIGHT = 576;
        const PROJECTILE_RADIUS = 5;

        class Player {
            constructor(x, y, radius, color, isBot = false) {
                this.x = x; this.y = y; this.radius = radius; this.color = color;
                this.score = 0; this.isBot = isBot;
            }
            draw() {
                c.save();
                c.shadowColor = this.isBot ? '#ff0000' : this.color;
                c.shadowBlur = this.isBot ? 40 : 20;
                c.beginPath();
                c.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                c.fillStyle = this.isBot ? '#ff0000' : this.color;
                c.fill();
                if (this.isBot) {
                    c.strokeStyle = '#ffff00';
                    c.lineWidth = 4;
                    c.stroke();
                }
                c.restore();
            }
        }

        class Projectile {
            constructor(x, y, velocity, color) {
                this.x = x; this.y = y; this.velocity = velocity;
                this.color = color; this.radius = PROJECTILE_RADIUS;
            }
            draw() {
                c.save();
                c.shadowColor = this.color;
                c.shadowBlur = 30;
                c.beginPath();
                c.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                c.fillStyle = this.color;
                c.fill();
                c.restore();
            }
        }

        let player = null;
        const players = {};  // real players
        const bots = {};     // NEW: bots
        const projectiles = {};

        // ── INPUT ──
        const keys = { w:false, a:false, s:false, d:false };
        window.addEventListener('keydown', e => { if('WASD'.includes(e.key.toUpperCase())) { keys[e.key.toLowerCase()] = true; socket.emit('updateKeys', keys); } });
        window.addEventListener('keyup',   e => { if('WASD'.includes(e.key.toUpperCase())) { keys[e.key.toLowerCase()] = false; socket.emit('updateKeys', keys); } });

        canvas.addEventListener('click', e => {
            if (!player) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mx = (e.clientX - rect.left) * scaleX / ratio;
            const my = (e.clientY - rect.top) * scaleY / ratio;
            const angle = Math.atan2(my - player.y, mx - player.x);
            socket.emit('shoot', { x: player.x, y: player.y, velocity: { x: Math.cos(angle), y: Math.sin(angle) } });
        });

        // ── SERVER EVENTS ──
        socket.on('init', ({ id, players: p, projectiles: proj, bots: b }) => {
            player = new Player(p[id].x, p[id].y, p[id].radius, p[id].color);
            scoreEl.textContent = `Score: ${p[id].score}`;

            Object.keys(p).forEach(pid => players[pid] = new Player(p[pid].x, p[pid].y, p[pid].radius, p[pid].color));
            Object.keys(b).forEach(bid => bots[bid] = new Player(b[bid].x, b[bid].y, b[bid].radius, 'red', true));
            Object.keys(proj).forEach(id => projectiles[id] = new Projectile(proj[id].x, proj[id].y, proj[id].velocity, proj[id].color));
        });

        socket.on('update', ({ players: p, projectiles: proj, bots: b }) => {
            // Update real players
            Object.keys(p).forEach(id => {
                if (!players[id]) players[id] = new Player(p[id].x, p[id].y, p[id].radius, p[id].color);
                players[id].x = p[id].x; players[id].y = p[id].y; players[id].score = p[id].score;
                if (id === socket.id) { player.x = p[id].x; player.y = p[id].y; scoreEl.textContent = `Score: ${p[id].score}`; }
            });
            Object.keys(players).forEach(id => { if (!p[id]) delete players[id]; });

            // Update bots
            Object.keys(b).forEach(id => {
                if (!bots[id]) bots[id] = new Player(b[id].x, b[id].y, b[id].radius, 'red', true);
                bots[id].x = b[id].x; bots[id].y = b[id].y;
            });
            Object.keys(bots).forEach(id => { if (!b[id]) delete bots[id]; });

            // Update projectiles
            Object.keys(proj).forEach(id => {
                if (!projectiles[id]) projectiles[id] = new Projectile(proj[id].x, proj[id].y, proj[id].velocity, proj[id].color);
                projectiles[id].x = proj[id].x; projectiles[id].y = proj[id].y;
            });
            Object.keys(projectiles).forEach(id => { if (!proj[id]) delete projectiles[id]; });
        });

        // ── ANIMATION LOOP ──
        function animate() {
            requestAnimationFrame(animate);
            c.fillStyle = 'rgba(0,0,0,0.1)';
            c.fillRect(0,0,CANVAS_WIDTH,CANVAS_HEIGHT);

            Object.values(bots).forEach(bot => bot.draw());
            Object.values(players).forEach(p => p.draw());
            Object.values(projectiles).forEach(proj => proj.draw());
            if (player) player.draw(); // draw yourself on top
        }
        animate();
    </script>
</body>
</html>
